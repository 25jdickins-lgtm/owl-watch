<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owl Watch Live Ranks</title>
    <style>
        body {
            background-image: url("Screenshot 2026-10-17 12.06.32 PM.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            margin: 0;
            height: 100vh;
        }
        .container {
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            display: inline-block;
            border-radius: 15px;
            background-color: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(5px);
            margin-top: 5vh;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { color: #ff9900; margin-top: 0; }
        .stat { font-size: 24px; margin: 15px 0; font-weight: bold; }
        
        /* Music Control Button Styling */
        .music-btn {
            background-color: #ff9900;
            color: black;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.4);
        }
        .music-btn:hover {
            background-color: #ffb84d;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🦉 Owl Watch Room</h1>
        <div id="timerDisplay" class="stat">Time: 0s</div>
        <div id="rankDisplay" class="stat">Rank: Beginner</div>
        
        <!-- Interactive Music Button -->
        <button id="musicButton" class="music-btn" onclick="toggleMusic()">🎵 Play Music</button>
    </div>

    <!-- Hidden audio element streaming a clean retro lofi beat -->
    <audio id="bgMusic" loop src="https://wikimedia.org"></audio>



    <script>
        let secondsSpent = 0;
        setInterval(() => {
            secondsSpent++;
            document.getElementById("timerDisplay").innerText = "Time: " + secondsSpent + "s";
            
            let rank = "Beginner";
            if (secondsSpent >= 10000) rank = "The Owl Himself 🦉";
            else if (secondsSpent >= 1000) rank = "Supreme Master";
            else if (secondsSpent >= 100) rank = "The God";
            else if (secondsSpent >= 50) rank = "Master";
            else if (secondsSpent >= 30) rank = "Hunter";
            else if (secondsSpent >= 20) rank = "Observer";
            else if (secondsSpent >= 10) rank = "Spectator";

            document.getElementById("rankDisplay").innerText = "Rank: " + rank;
        }, 1000);

        // Music toggle functionality
        const music = document.getElementById("bgMusic");
        const button = document.getElementById("musicButton");

        function toggleMusic() {
            if (music.paused) {
                music.play();
                button.innerText = "⏸️ Pause Music";
            } else {
                music.pause();
                button.innerText = "🎵 Play Music";
            }
        }
    </script>

</body>
</html>
