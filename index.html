<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owl Watch Live Ranks</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            border: 2px solid #333;
            padding: 30px;
            display: inline-block;
            border-radius: 10px;
            background-color: #1e1e1e;
        }
        h1 { color: #ff9900; }
        .stat { font-size: 24px; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🦉 Owl Watch Room</h1>
        <div id="timerDisplay" class="stat">Time: 0s</div>
        <div id="rankDisplay" class="stat">Rank: Beginner</div>
    </div>

    <script>
        let secondsSpent = 0;
        setInterval(() => {
            secondsSpent++;
            document.getElementById("timerDisplay").innerText = "Time: " + secondsSpent + "s";
            
            let rank = "Beginner";
            if (secondsSpent >= 10000) rank = "The Owl Himself 🦉";
            else if (secondsSpent >= 1000) rank = "Supreme Master";
            else if (secondsSpent >= 100) rank = "The God";
            else if (secondsSpent >= 50) rank = "Master";
            else if (secondsSpent >= 30) rank = "Hunter";
            else if (secondsSpent >= 20) rank = "Observer";
            else if (secondsSpent >= 10) rank = "Spectator";

            document.getElementById("rankDisplay").innerText = "Rank: " + rank;
        }, 1000);
    </script>

</body>
</html>
